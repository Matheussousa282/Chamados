<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Chamados</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#66d8d8; --accent:#06b6d4;
      --success:#10b981; --danger:#ef4444; --glass: rgba(255,255,255,0.03);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; background:
      linear-gradient(180deg,#474744 0%, #474744 60%), var(--bg);
      color:#18f0e5;
      padding:28px;
    }
    .container{max-width:1100px;margin:0 auto}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}
    h1{font-size:20px;margin:0}
    .sub{color:var(--muted);font-size:13px}
    .card{background:linear-gradient(180deg, rgba(161, 121, 10, 0.849), rgba(255,255,255,0.01)); border-radius:12px;padding:16px;box-shadow: 0 6px 18px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    .flex{display:flex}
    .gap{gap:12px}
    .col{display:flex;flex-direction:column}
    /* Form */
    .form-row{display:flex;gap:12px;align-items:center}
    input[type="text"], textarea, select{
      background:var(--card); border:1px solid rgba(255,255,255,0.03);
      color:var(--muted); padding:10px;border-radius:8px;outline:none;
      font-size:14px; width:100%;
    }
    textarea{min-height:80px; resize:vertical}
    button{
      background:var(--accent); border:none; color:#042027; padding:10px 14px;
      border-radius:10px; cursor:pointer; font-weight:600;
    }
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04); color:var(--muted)}
    .tool-row{display:flex;gap:8px;align-items:center}
    /* Tickets list */
    .list{margin-top:16px;display:grid;gap:10px}
    .ticket{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.02)}
    .ticket .main{flex:1}
    .ticket h3{margin:0;font-size:15px}
    .ticket p{margin:6px 0;color:var(--muted);font-size:13px}
    .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
    .badge{padding:6px 8px;border-radius:999px;font-weight:700;font-size:12px}
    .badge.open{background:rgba(6,182,212,0.12);color:var(--accent);border:1px solid rgba(6,182,212,0.08)}
    .badge.progress{background:rgba(255,193,7,0.08);color:#ffd166;border:1px solid rgba(255,193,7,0.06)}
    .badge.closed{background:rgba(16,185,129,0.08);color:var(--success);border:1px solid rgba(16,185,129,0.06)}
    .actions{display:flex;gap:8px}
    .small{font-size:12px;padding:6px 8px;border-radius:8px}
    .small.ghost{background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted)}
    .danger{background:rgba(239,68,68,0.12);color:var(--danger);border:1px solid rgba(239,68,68,0.06)}
    /* Filters area */
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .search{min-width:220px}
    .empty{color:var(--muted);padding:20px;text-align:center;border-radius:8px}
    /* Responsive */
    @media (max-width:820px){
      .form-row{flex-direction:column}
      header{flex-direction:column;align-items:flex-start;gap:8px}
      .ticket{flex-direction:column;align-items:stretch}
    }
    
    /* Ajustes responsivos gerais */
@media (max-width: 820px) {
  body {
    padding: 16px;
  }

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  h1 {
    font-size: 18px;
  }

  .tool-row {
    flex-wrap: wrap;
    gap: 6px;
  }

  .tool-row button,
  .tool-row label {
    flex: 1 1 48%;
    text-align: center;
  }

  .card {
    padding: 14px;
  }

  .form-row {
    flex-direction: column;
    align-items: stretch;
  }

  input[type="text"],
  textarea,
  select,
  button {
    font-size: 15px;
  }

  .filters {
    flex-direction: column;
    align-items: stretch;
    width: 100%;
  }

  .filters .search {
    min-width: unset;
    width: 100%;
  }

  .list {
    grid-template-columns: 1fr;
  }

  .ticket {
    flex-direction: column;
    align-items: stretch;
    word-break: break-word;
  }

  .actions {
    flex-wrap: wrap;
    justify-content: flex-start;
  }

  .actions button {
    flex: 1 1 45%;
    font-size: 14px;
  }

  .meta {
    flex-wrap: wrap;
  }
}


    #techBackground {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  background: #0f1724;
}

/* ---------- Modo Monitor ---------- */
body.monitor-mode header,
body.monitor-mode section.card:first-of-type {
  display: none;
}

body.monitor-mode .container {
  max-width: 100%;
  padding: 0;
}

body.monitor-mode section.card {
  border: none;
  background: transparent;
  box-shadow: none;
}

body.monitor-mode #list {
  margin-top: 0;
}

body.monitor-mode .ticket {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  font-size: 16px;
}

body.monitor-mode {
  background: #0a0f17;
}

body.monitor-mode .tool-row {
  display: none;
}

body.monitor-mode::after {
  content: "MONITOR MODE";
  position: fixed;
  bottom: 10px;
  right: 20px;
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 2px;
}

  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Painel de Chamados</h1>
      <div class="sub">Excelencia Lingerie</div>
    </div>
    <div class="tool-row">
      
      <button id="exportBtn" class="ghost small" title="Exportar todos os chamados como JSON">Exportar JSON</button>
      <button id="exportPdfBtn" class="ghost small" title="Exportar todos os chamados em PDF">Exportar PDF</button>
      <label class="ghost small" style="cursor:pointer;display:inline-flex;align-items:center;">
        <input type="file" id="importFile" accept="application/json" style="display:none" />
        Importar JSON
      </label>
      <button id="clearBtn" class="danger small" title="Remover todos os chamados">Limpar tudo</button>
    </div>
  </header>
       <button id="monitorBtn" class="ghost small">🖥️ Modo Monitor</button>
  <section class="card">
    <form id="ticketForm" class="col" onsubmit="return false;">
      <div class="form-row gap">
        <input type="text" id="titleInput" placeholder="Setor" required />
        <select id="prioritySelect" style="width:160px">
          <option value="normal">Prioridade: Normal</option>
          <option value="alta">Prioridade: Alta</option>
          <option value="baixa">Prioridade: Baixa</option>
        </select>
      </div>
      <div style="margin-top:10px" class="form-row">
        <textarea id="descInput" placeholder="Descreva o problema..." required></textarea>
      </div>
      <div style="margin-top:10px" class="form-row" >
        <div style="flex:1" class="meta">
          <input id="ownerInput" type="text" placeholder="Tecnico" style="padding:8px;border-radius:8px;background:var(--card);border:1px solid rgba(255,255,255,0.03);color:var(--muted);width:220px" />
          <span class="sub" style="margin-left:6px">Pressione Criar para adicionar</span>
        </div>
        <div style="display:flex;gap:8px">
          <button id="createBtn" type="button">Criar Chamado</button>
          <button id="updateBtn" type="button" class="ghost" style="display:none">Salvar</button>
          <button id="cancelEditBtn" type="button" class="ghost" style="display:none">Cancelar</button>
        </div>
      </div>
    </form>
  </section>

  <section style="margin-top:18px" class="card">
    <div class="flex" style="justify-content:space-between;align-items:center">
      <div class="filters">
        <input id="searchInput" class="search" type="text" placeholder="Pesquisar por título, descrição ou tecnico..." />
        <select id="statusFilter">
          <option value="all">Todos os status</option>
          <option value="Aberto">Aberto</option>
          <option value="Em Progresso">Em Progresso</option>
          <option value="AbertoEmProgresso">Abertos e Em Progresso</option>
          <option value="Fechado">Fechado</option>
        </select>
        <select id="sortSelect">
          <option value="newest">Mais recentes</option>
          <option value="oldest">Mais antigos</option>
          <option value="priority">Por prioridade</option>
        </select>
      </div>
      <div class="sub">Total: <span id="totalCount">0</span></div>
    </div>
    <div id="list" class="list" aria-live="polite" style="margin-top:12px"></div>
    <div id="empty" class="empty" style="display:none">Nenhum chamado encontrado — crie o primeiro acima 🎉</div>
  </section>

  
</div>
<canvas id="techBackground"></canvas>
<script>

const canvas = document.getElementById("techBackground");
const ctx = canvas.getContext("2d");
let w, h;
let logos = [];
const logoImg = new Image();
logoImg.src = "logoexc.ico"; // caminho da sua logo

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// função que cria uma nova logo vindo de baixo
function spawnLogo() {
  return {
    x: Math.random() * w,            // posição X aleatória
    y: h + 50,                       // começa abaixo da tela
    vy: -0.3 - Math.random() * 0.7,  // sobe para cima
    size: 40 + Math.random() * 50,   // tamanho aleatório
    alpha: 0,                        // começa invisível
  };
}

// adiciona várias logos iniciais
for (let i = 0; i < 20; i++) {
  logos.push(spawnLogo());
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "rgba(10, 20, 30, 0.9)";
  ctx.fillRect(0, 0, w, h);

  // adiciona novas logos ao longo do tempo
  if (logos.length < 50 && Math.random() < 0.05) {
    logos.push(spawnLogo());
  }

  for (let i = 0; i < logos.length; i++) {
    const p = logos[i];
    p.y += p.vy;
    p.alpha = Math.min(p.alpha + 0.01, 1); // efeito de fade-in

    // desenha a logo
    ctx.globalAlpha = p.alpha * 0.8;
    ctx.drawImage(logoImg, p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;

    // se saiu da tela por cima, remove
    if (p.y + p.size < 0) {
      logos.splice(i, 1);
      i--;
    }
  }

  requestAnimationFrame(draw);
}

// só começa a animar quando a imagem carregar
logoImg.onload = () => {
  draw();
};




const API_URL = "https://chamados-opal-iota.vercel.app/api/tickets"; // coloque a URL do Vercel

let tickets = [];
let editingId = null;

// elementos
const el = id => document.getElementById(id);
const qs = (sel, ctx=document)=> ctx.querySelector(sel);
const qsa = (sel, ctx=document)=> Array.from(ctx.querySelectorAll(sel));
const formatDate = d=> new Date(d).toLocaleString();

const titleInput = el("titleInput");
const descInput = el("descInput");
const ownerInput = el("ownerInput");
const prioritySelect = el("prioritySelect");
const createBtn = el("createBtn");
const updateBtn = el("updateBtn");
const cancelEditBtn = el("cancelEditBtn");
const listEl = el("list");
const emptyEl = el("empty");
const searchInput = el("searchInput");
const statusFilter = el("statusFilter");
const sortSelect = el("sortSelect");
const totalCountEl = el("totalCount");
const exportBtn = el("exportBtn");
const exportPdfBtn = el("exportPdfBtn");
const importFile = el("importFile");
const clearBtn = el("clearBtn");



// helpers
function priorityLabel(p){ if(p==="alta") return "Alta"; if(p==="baixa") return "Baixa"; return "Normal"; }
function statusBadgeClass(s){ if(s==="Aberto") return "badge open"; if(s==="Em Progresso") return "badge progress"; if(s==="Fechado") return "badge closed"; return "badge"; }
function escapeHtml(s){ if(!s && s!==0) return ""; return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;"); }
function debounce(fn, wait=200){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=> fn.apply(this,args),wait); }; }

// ---------- Backend ----------
async function loadTicketsDB(){ 
  try { 
    const res = await fetch(API_URL); 
    tickets = await res.json(); 
    render(); 
  } catch(err){ console.error(err); alert("Erro ao carregar tickets do banco"); } 
}

async function createTicketDB(ticket){ 
  const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(ticket)});
  const data = await res.json();
  tickets.unshift(data);
  render();
}

async function updateTicketDB(id, changes){ 
  const res = await fetch(`${API_URL}?id=${id}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(changes)});
  const data = await res.json();
  const idx=tickets.findIndex(t=>t.id==id);
  tickets[idx]=data;
  render();
}

async function deleteTicketDB(id){ 
  const res = await fetch(`${API_URL}?id=${id}`, {method:"DELETE"});
  if(res.ok){ tickets=tickets.filter(t=>t.id!==id); render(); }
}



function downloadJSON(obj, filename = "data.json") {
  if (!obj) return;
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportTicketPdf(ticket) {
  if (!ticket) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(16);
  doc.text(`Chamado #${ticket.id}`, 10, 20);

  doc.setFontSize(12);
  doc.text(`Título: ${ticket.titulo}`, 10, 30);
  doc.text(`Descrição: ${ticket.descricao}`, 10, 40);
  doc.text(`Tecnico: ${ticket.tecnico || "—"}`, 10, 50);
  doc.text(`Prioridade: ${ticket.prioridade}`, 10, 60);
  doc.text(`Status: ${ticket.status}`, 10, 70);
  doc.text(`Criado em: ${new Date(ticket.criado_em).toLocaleString()}`, 10, 80);
  doc.text(`Última atualização: ${new Date(ticket.atualizado_em).toLocaleString()}`, 10, 90);

  doc.save(`chamado-${ticket.id}.pdf`);
}

function downloadAllJSON() {
  if (!tickets.length) return alert("Não há chamados para exportar.");
  const blob = new Blob([JSON.stringify(tickets, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "todos-chamados.json";
  a.click();
  URL.revokeObjectURL(url);
}

function exportAllPdf() {
  if (!tickets.length) return alert("Não há chamados para exportar.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;

  tickets.forEach((t, index) => {
    doc.setFontSize(14);
    doc.text(`Chamado #${t.id}`, 10, y);
    y += 8;
    doc.setFontSize(12);
    doc.text(`Título: ${t.titulo}`, 10, y); y += 6;
    doc.text(`Descrição: ${t.descricao}`, 10, y); y += 6;
    doc.text(`Tecnico: ${t.tecnico || "—"}`, 10, y); y += 6;
    doc.text(`Prioridade: ${t.prioridade}`, 10, y); y += 6;
    doc.text(`Status: ${t.status}`, 10, y); y += 6;
    doc.text(`Criado em: ${new Date(t.criado_em).toLocaleString()}`, 10, y); y += 6;
    doc.text(`Última atualização: ${new Date(t.atualizado_em).toLocaleString()}`, 10, y); y += 10;

    if (y > 270) { // nova página se passar do limite
      doc.addPage();
      y = 20;
    }
  });

  doc.save("todos-chamados.pdf");
}

// LIGAÇÃO DOS BOTÕES DE EXPORTAÇÃO
exportBtn.onclick = downloadAllJSON;
exportPdfBtn.onclick = exportAllPdf;
// ---------- render ----------
function render(){
  let list = tickets.slice();
  const query = (searchInput.value||"").trim().toLowerCase();
  const status = statusFilter.value;
  if(query) list = list.filter(t=> (t.titulo||"").toLowerCase().includes(query) || (t.descricao||"").toLowerCase().includes(query) || (t.tecnico||"").toLowerCase().includes(query));
  if (status !== "all") {
  if (status === "AbertoEmProgresso") {
    list = list.filter(t => t.status === "Aberto" || t.status === "Em Progresso");
  } else {
    list = list.filter(t => t.status === status);
  }
}

  const sortMode = sortSelect.value;
  if(sortMode==="newest") list.sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em));
  else if(sortMode==="oldest") list.sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em));
  else if(sortMode==="priority"){ const order={ "alta":0,"normal":1,"baixa":2 }; list.sort((a,b)=>(order[a.prioridade]||1)-(order[b.prioridade]||1)); }

  totalCountEl.textContent = list.length;
  if(list.length===0){ listEl.innerHTML=""; emptyEl.style.display="block"; return; } else emptyEl.style.display="none";

  listEl.innerHTML="";
  for(const t of list){
    const item=document.createElement("div");
    item.className="ticket";
    item.innerHTML=`
      <div class="main">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
          <div>
            <h3>${escapeHtml(t.titulo)} <span style="font-weight:600;color:var(--muted);font-size:12px">• ${priorityLabel(t.prioridade)}</span></h3>
            <div class="meta" style="margin-top:6px">
              <div class="${statusBadgeClass(t.status)}">${t.status}</div>
              <div>tecnico: ${escapeHtml(t.tecnico||"—")}</div>
              <div>Criado: ${formatDate(t.criado_em)}</div>
            </div>
          </div>
          <div class="actions">
            <button class="small ghost" data-action="edit" data-id="${t.id}" title="Editar">✏️</button>
            <button class="small ghost" data-action="status" data-id="${t.id}" title="Alterar status">🔁</button>
            <button class="small ghost" data-action="export" data-id="${t.id}" title="Exportar JSON">⬇️</button>
            <button class="small ghost" data-action="pdf" data-id="${t.id}" title="Exportar PDF">📄</button>
            <button class="small danger" data-action="delete" data-id="${t.id}" title="Excluir">🗑️</button>
          </div>
        </div>
        <p>${escapeHtml(t.descricao)}</p>
        <div class="meta" style="margin-top:6px;color:var(--muted);font-size:12px">Última atualização: ${formatDate(t.atualizado_em)}</div>
      </div>
    `;
    listEl.appendChild(item);
  }

// --- Modal de alteração de status ---
function changeStatusDialog(id) {
  const t = tickets.find(x => x.id == id);
  if (!t) return alert("Chamado não encontrado");

  // Cria o modal
  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "rgba(0,0,0,0.6)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "9999";

  const modal = document.createElement("div");
  modal.style.background = "var(--card)";
  modal.style.border = "1px solid rgba(255,255,255,0.1)";
  modal.style.borderRadius = "12px";
  modal.style.padding = "20px";
  modal.style.minWidth = "280px";
  modal.style.color = "var(--muted)";
  modal.style.boxShadow = "0 6px 20px rgba(0,0,0,0.5)";
  modal.innerHTML = `
    <h3 style="margin-top:0;font-size:16px;color:#18f0e5">Alterar Status</h3>
    <p style="font-size:14px;margin-bottom:10px;">Selecione o novo status do chamado:</p>
    <select id="statusSelectModal" style="width:100%;padding:8px;background:var(--bg);color:#18f0e5;border-radius:8px;border:1px solid rgba(255,255,255,0.1);">
      <option value="Aberto" ${t.status==="Aberto"?"selected":""}>Aberto</option>
      <option value="Em Progresso" ${t.status==="Em Progresso"?"selected":""}>Em Progresso</option>
      <option value="Fechado" ${t.status==="Fechado"?"selected":""}>Fechado</option>
    </select>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
      <button id="cancelStatusBtn" class="ghost small">Cancelar</button>
      <button id="confirmStatusBtn" class="small" style="background:var(--accent);color:#042027;">Salvar</button>
    </div>
  `;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  // Fechar modal
  const closeModal = () => document.body.removeChild(overlay);

  // Eventos dos botões
  modal.querySelector("#cancelStatusBtn").onclick = closeModal;
  modal.querySelector("#confirmStatusBtn").onclick = async () => {
    const newStatus = modal.querySelector("#statusSelectModal").value;
    await updateTicketDB(id, {
      titulo: t.titulo,
      descricao: t.descricao,
      tecnico: t.tecnico,
      prioridade: t.prioridade,
      status: newStatus
    });
    closeModal();
  };
}

  qsa("button[data-action]", listEl).forEach(btn=>{
  btn.onclick=()=>{
    const id=Number(btn.dataset.id); 
    const action=btn.dataset.action;
    if(action==="edit") startEdit(id);
    if(action==="status") changeStatusDialog(id); // chama função global
    if(action==="delete"){ if(confirm("Excluir este chamado? Esta ação não pode ser desfeita.")) deleteTicketDB(id); }
    if(action==="export"){ const t=tickets.find(x=>x.id===id); downloadJSON(t, `chamado-${id}.json`); }
    if(action==="pdf"){ const t=tickets.find(x=>x.id===id); exportTicketPdf(t); }
  };
});
}

// ---------- edit ----------
function startEdit(id){
  const t=tickets.find(x=>x.id==id); if(!t) return alert("Chamado não encontrado");
  editingId=id; titleInput.value=t.titulo; descInput.value=t.descricao; ownerInput.value=t.tecnico||""; prioritySelect.value=t.prioridade||"normal";
  createBtn.style.display="none"; updateBtn.style.display="inline-block"; cancelEditBtn.style.display="inline-block";
}
function cancelEdit(){ editingId=null; titleInput.value=""; descInput.value=""; ownerInput.value=""; prioritySelect.value="normal"; createBtn.style.display="inline-block"; updateBtn.style.display="none"; cancelEditBtn.style.display="none"; }
function commitEdit() {
  if(!editingId) return;
  const titulo = titleInput.value.trim();
  const descricao = descInput.value.trim();
  if(!titulo||!descricao) return alert("Título e descrição são obrigatórios.");
  updateTicketDB(editingId, { titulo, descricao, tecnico: ownerInput.value.trim(), prioridade: prioritySelect.value });
  cancelEdit();
}

// ---------- events ----------
createBtn.onclick = async () => {
  const titulo = titleInput.value.trim();
  const descricao = descInput.value.trim();
  if(!titulo||!descricao) return alert("Preencha título e descrição.");
  await createTicketDB({ titulo, descricao, tecnico: ownerInput.value.trim(), prioridade: prioritySelect.value });
  titleInput.value = ""; descInput.value = ""; ownerInput.value = ""; prioritySelect.value = "normal"; titleInput.focus();
};
updateBtn.onclick = () => commitEdit();
cancelEditBtn.onclick = () => cancelEdit();
searchInput.oninput = debounce(()=>render(),250);
statusFilter.onchange = ()=>render();
sortSelect.onchange = ()=>render();

// ---------- inicializa ----------
window.addEventListener("load", async () => {
  await loadTicketsDB();
  // Filtra automaticamente "Aberto" ao carregar
  statusFilter.value = "AbertoEmProgresso";
  render();
});



// --- Atualização automática no modo monitor ---
let monitorInterval = null;

function applyMonitorFilter() {
  // Define o filtro de status como Aberto + Em Progresso
  statusFilter.value = "AbertoEmProgresso";
  render();
}


function startMonitorAutoRefresh() {
  if (monitorInterval) return; // evita duplicar
  monitorInterval = setInterval(() => {
    if (document.body.classList.contains("monitor-mode")) {
      console.log("🔄 Atualizando lista automaticamente...");
      loadTicketsDB();
    }
  }, 30000); // 30 segundos
}

function stopMonitorAutoRefresh() {
  if (monitorInterval) {
    clearInterval(monitorInterval);
    monitorInterval = null;
  }
}

// --- Alternar modo monitor ---
const monitorBtn = document.getElementById("monitorBtn");
monitorBtn.onclick = () => {
  document.body.classList.toggle("monitor-mode");

  const ativo = document.body.classList.contains("monitor-mode");
  monitorBtn.textContent = ativo
    ? "🔙 Sair do Modo Monitor"
    : "🖥️ Modo Monitor";

  if (ativo) {
    applyMonitorFilter();
    startMonitorAutoRefresh();
  } else {
    stopMonitorAutoRefresh();
  }
};

</script>
